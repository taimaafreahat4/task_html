<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Registration Form</title>
</head>

<body>

    <h1>Registration Form !</h1>

    <form style="border: 1px dotted black; width: 530px; padding: 20px;">

        <h2>Personal details</h2>

        <hr>

        <br>

        <label>First name:</label>
        <input type="text" name="firstname">

        <br><br>

        <label>Last name:</label>
        <input type="text" name="lastname">

        <br><br>

        <label>Email:</label>
        <input type="email" name="email">

        <br><br>

        <label>Gender:</label>

        <input type="radio" name="gender" value="male">
        Male

        <input type="radio" name="gender" value="female">
        Female

        <br><br>

        <label>City:</label>

        <select name="city">
            <option>Amman</option>
            <option>Irbid</option>
            <option>Zarqa</option>
            <option>Aqaba</option>
            <option>Ajloun</option>

        </select>

        <br><br>

        <button type="submit">Sign up</button>

    </form>
    <br>
    <a href="page6.html">
        <button>Back</button>
    </a>
    

</body>

</html>
