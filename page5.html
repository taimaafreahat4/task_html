<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Images in Tables</title>
    <style>
    table, th, td {
        border: 1px dashed black;
        border-collapse: collapse;
    }
</style>
</head>

<body>

    <h1>Images in Tables</h1>

    <hr>

    <h3>What are your favorite pets ?</h3>

    <table border="1" cellpadding="10" cellspacing="0">

        <tr>
            <th>Pet Image</th>
            <th>More Facts about (as a Link)</th>
        </tr>

        <tr>
            <td>
                <img src="hourse.jpg" alt="Horse" width="250">
            </td>

            <td>
                <a href="https://en.wikipedia.org/wiki/Horse">
                    Horse
                </a>
            </td>
        </tr>

        <tr>
            <td>
                <img src="dog.jpg" alt="Dogs" width="250">
            </td>

            <td>
                <a href="https://en.wikipedia.org/wiki/Dog">
                    Dogs
                </a>
            </td>
        </tr>

        <tr>
            <td>
                <img src="cat.jpg" alt="Cats" width="250">
            </td>

            <td>
                <a href="https://en.wikipedia.org/wiki/Cat">
                    Cats
                </a>
            </td>
        </tr>

    </table>

    <br><br>

    </a> 
    <a href="page4.html">
        <button>Back</button>
    </a>

</body>

</html>
